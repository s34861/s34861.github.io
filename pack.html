<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แพ็ค</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pack-body" onclick="triggerPackOpening()">

    <!-- เอฟเฟกต์แสงไฟเรืองด้านหลัง -->
    <div class="ambient-glow"></div>

    <!-- ส่วนแสดงการ์ดแพ็คตรงกลาง -->
    <div class="pack-container">
        <div class="toty-logo">คัดสรร นักเรียนเพื่อเข้าสู่รั้วมหาวิทยาลัย</div>

        <div class="pack-stage">
            <div class="toty-pack">
                <div class="pack-badge">?</div>
                <div style="color: #00d2ff; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px;">RANDOM STUDENT</div>
            </div>
            <div class="pack-instruction">✦ คลิกตรงไหนก็ได้เพื่อเปิดดำเนินการต่อ ✦</div>
        </div>
    </div>

    <!-- ฉากเฟดสีขาววาบ (White Flash) -->
    <div class="white-flash-overlay" id="whiteFlash"></div>

    <!-- วิดีโอเต็มจอ (Full Screen Video) -->
    <div class="fullscreen-video-container" id="fullscreenVideo">
        <!-- เปลี่ยน your-pack-video.mp4 เป็นชื่อไฟล์วิดีโอของคุณ -->
        <video id="packVideo" playsinline>
            <source src="pack.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>

        <!-- ปุ่มสำหรับกดเข้าสู่หน้าหลัก (index.html) ลอยบนวิดีโอ -->
        <div class="video-overlay-action" id="videoActionBtn">
            <a href="index.html" class="btn-stat-gold">⚡ ดู STAT ตัวละคร (เข้าสู่หน้าหลัก) ⚡</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
